

name: Deploy News Radar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project
        run: |
          mkdir -p site

          if [ ! -f news-radar-github-pages-1.zip ]; then
            echo "Project ZIP file not found!"
            exit 1
          fi

          unzip -q news-radar-github-pages-1.zip -d site

          PACKAGE_JSON=$(find site -type f -name package.json -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json not found in ZIP!"
            find site -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Install and collect news
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm run update-news

      - name: Check website files
        run: |
          if [ ! -d "$PROJECT_DIR/public" ]; then
            echo "Public folder not found!"
            exit 1
          fi

          ls -la "$PROJECT_DIR/public"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/public

      - name: Deploy website
        uses: actions/deploy-pages@v4
